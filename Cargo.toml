[package]
name = "dynare-rs"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
description = "A Rust port of Dynare 7.2: preprocessor, perturbation solvers, Kalman filtering, Bayesian estimation, simulations and analysis of DSGE models from .mod files"
license = "GPL-3.0-or-later"
repository = "https://github.com/haiswell/dynare-rust"
readme = "README.md"
keywords = ["dynare", "dsge", "economics", "estimation", "macroeconomics"]
categories = ["science", "mathematics", "command-line-utilities"]
# Unofficial port of Dynare; not published to crates.io (yet).
publish = false
exclude = ["reference/", "tests/", ".github/"]

[dependencies]
anyhow = "1.0.104"
calamine = "0.37.0"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
matrixmultiply = "0.3"
nalgebra = "0.33"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
rayon = "1.12.0"
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts"] }
rust_xlsxwriter = { version = "0.101.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
statrs = "0.19.1"
thiserror = "2.0.21"

# The library keeps the short name `dynare` (`use dynare::...`).
[lib]
name = "dynare"
path = "src/lib.rs"

[[bin]]
name = "dynare-rs"
path = "src/main.rs"

# Debug/test builds: optimise dependencies (nalgebra, statrs, rand...) so `cargo test`
# without --release is not pathologically slow; the crate itself stays at opt-level 0.
[profile.dev.package."*"]
opt-level = 2

# Lints for every target (lib, bins, tests, examples). The allowed clippy lints are style
# preferences that clash with code transcribed from MATLAB: index loops over several arrays,
# `!(a > b)` as MATLAB's NaN-aware comparison, long argument lists mirroring Dynare's
# functions, literal constants copied with full precision, and mirrored if/else branches.
[lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
neg_cmp_op_on_partial_ord = "allow"
excessive_precision = "allow"
collapsible_if = "allow"
if_same_then_else = "allow"
mut_range_bound = "allow"
large_enum_variant = "allow"
should_implement_trait = "allow"
identity_op = "allow"
manual_clamp = "allow"            # `.min(a).max(b)` keeps MATLAB's NaN behaviour; clamp panics/propagates differently
unnecessary_fold = "allow"        # folds that must visit every element (memoising side effects)
disallowed_names = "allow"        # variable names kept from the MATLAB sources
chunks_exact_to_as_chunks = "allow"
redundant_guards = "allow"
while_let_loop = "allow"
field_reassign_with_default = "allow"
